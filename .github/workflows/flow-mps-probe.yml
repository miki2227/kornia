name: Flow singleton MPS probe

on:
  push:
    branches: [verify/flow-singleton-mps]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.14.0 numpy packaging kornia-rs==0.2.0
      - run: python -u -m flow_mps_probe
